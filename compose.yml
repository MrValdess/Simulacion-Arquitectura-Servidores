version: '3.8'

services:
#DEV Drupal(Apache) + MySQL
  drupal:
    image: drupal:10-apache
    container_name: drupal_dev
    restart: always
    volumes:
      - devData:/var/www/html/
    ports:
      - 8080:80
    dns:
      - 172.20.0.6
    networks:
      development_net:
        ipv4_address: 172.40.0.5
    depends_on:
      - mysql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drupal.rule=Host(`dev.localhost`)"
      - "traefik.http.routers.drupal.service=drupal"
      - "traefik.http.services.drupal.loadbalancer.server.port=80"

  mysql:
    image: mysql
    container_name: mysql
    restart: always
    volumes:
      - devdb:/var/lib/mysql
    environment:
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupal
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    dns:
      - 172.20.0.6
    networks:
      development_net:
        ipv4_address: 172.40.0.6

#------------------------------------------------------------#

#WIP PROD NGINX + POSTGRES
  nginxProd:
    image: 'bitnami/nginx:latest'
    container_name: nginxprod
    restart: always
    volumes:
      - ./Production/server-block.conf:/opt/bitnami/nginx/conf/server_blocks/server-block.conf  # Configuración de Nginx
      - prodData:/app
    ports:
      - 8081:80
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.5
    depends_on:
      - phpfpm1
      - phpfpm2
      - postgresql

  phpfpm1:
    image: 'bitnami/php-fpm:latest'
    container_name: phpfpm1
    restart: always
    entrypoint: bash /drupalinit.sh
    volumes:
      - ./Production/drupalinit.sh:/drupalinit.sh
      - ./Production/php.ini:/opt/bitnami/php/etc/php.ini
      - prodData:/app
    environment:
      - PHP_ENABLE_OPCACHE=1
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.6
    depends_on:
      - postgresql

  phpfpm2:
    image: 'bitnami/php-fpm:latest'
    container_name: phpfpm2
    restart: always
    volumes:
      - ./Production/php.ini:/opt/bitnami/php/etc/php.ini
      - prodData:/app
    environment:
      - PHP_ENABLE_OPCACHE=1
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.7
    depends_on:
      - postgresql

  postgresql:
    image: 'bitnami/postgresql:latest'
    container_name: postgresql
    restart: always
    volumes:
      - proddb:/bitnami/postgresql
    environment:
      - POSTGRESQL_DATABASE=drupal
      - POSTGRESQL_USERNAME=drupal
      - POSTGRESQL_PASSWORD=password
    dns:
      - 172.20.0.6
    networks:
      production_net:
        ipv4_address: 172.30.0.8

#------------------------------------------------------------#

# NAS + DNS

  bind9:
    image: internetsystemsconsortium/bind9:9.20
    container_name: bind9
    dns:
      - 172.20.0.6
    restart: always
    volumes:
      - ./bind/config:/etc/bind                   # Configuración principal
      - ./bind/config/zones:/etc/bind/zones       # Archivos de zona
      - dnscache:/var/cache/bind                  # Caché y directorio de trabajo
      - dnslogs:/var/log                          # Logs
    environment:
      - TZ=Europe/Madrid
    networks:
      services_net:
        ipv4_address: 172.20.0.6


#------------------------------------------------------------#

# SSH
  ssh1:     #Por par de claves
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: openssh1-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PUBLIC_KEY_FILE=/config/keys/id_rsa.pub 
      - PUBLIC_KEY_DIR=/config/keys
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false 
      - LOG_STDOUT=true
    volumes:
      - ./ssh/development/ssh1.config:/config/sshd_config
      - ./ssh/development/keys:/config/keys
    networks:
      development_net:
        ipv4_address: 172.40.0.10
    restart: unless-stopped

  ssh2:     #Por login
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: openssh2-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=user2
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=supersecreto
      - LOG_STDOUT=true
    volumes:
      - ./ssh/service/ssh2.config:/config/sshd_config
      - ./ssh/service/authorized_keys:/config/ssh/authorized_keys
    networks:
      services_net:
        ipv4_address: 172.20.0.10   # IP fija dentro de la red de servicios
    restart: unless-stopped   
  
# Firewall WIP
  firewall:
    image: alpine:latest
    container_name: firewall
    restart: always
    cap_add:
      - NET_ADMIN
    volumes:
      - ./firewall/startup.sh:/firewall.sh
    networks:
      development_net:
        ipv4_address: 172.40.0.15
      production_net:
        ipv4_address: 172.30.0.15
      services_net:
        ipv4_address: 172.20.0.15
    command: sh /firewall.sh

#------------------------------------------------------------#

networks:
  services_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  production_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  development_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24

#------------------------------------------------------------#

volumes:
  devData:
  devdb:
  prodData:
  proddb:
  dnscache:
  dnslogs:
