version: '3.8'

services:
#DEV Apache + MySQL
  apache:
    image: php:8.2-apache
    container_name: apache_web
    restart: always
    volumes:
      - ./apache/web:/var/www/html
      - ./apache/sites:/etc/apache2/sites-available
      - ./apache/apacheinit.sh:/init.sh
      - samba_data:/documentacion
    entrypoint: ["/bin/bash", "/init.sh"]
    dns:
      - 172.20.0.6
    ports:
      - "8080:80"
    networks:
      development_net:
        ipv4_address: 172.40.0.5

  mysql:
    image: mysql
    container_name: mysql
    restart: always
    volumes:
      - devdb:/var/lib/mysql
    environment:
      MYSQL_DATABASE: apache
      MYSQL_USER: apache
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    networks:
      development_net:
        ipv4_address: 172.40.0.6

#------------------------------------------------------------#

#PROD NGINX + POSTGRES
  nginxProd:
    image: 'bitnami/nginx:latest'
    container_name: nginxprod
    restart: always
    volumes:
      - ./Production/server-block.conf:/opt/bitnami/nginx/conf/server_blocks/server-block.conf  # Configuración de Nginx
      - prodData:/app
    ports:
      - 8081:80
    networks:
      production_net:
        ipv4_address: 172.30.0.5
    depends_on:
      - postgresql


  postgresql:
    image: 'bitnami/postgresql:latest'
    container_name: postgresql
    restart: always
    volumes:
      - proddb:/bitnami/postgresql
    environment:
      - POSTGRESQL_DATABASE=nginx
      - POSTGRESQL_USERNAME=nginx
      - POSTGRESQL_PASSWORD=password
    networks:
      production_net:
        ipv4_address: 172.30.0.8

#------------------------------------------------------------#

# NAS

  nasServ:
    image: debian:latest
    container_name: nasserv
    restart: always
    command: bash ./backups/startup.sh
    environment:
      MYSQL_ROOT_PASSWORD: password           # Contraseña de MySQL
      POSTGRES_PASSWORD: postgrespassword         # Contraseña de PostgreSQL
    volumes:
      - ./nas_data/backups:/backups               # Monta el directorio de copias de seguridad
    networks:
      services_net:
        ipv4_address: 172.20.0.5
    ports:
      - "873:873"
    depends_on:
      - bind9
    tty: true


  # DNS 
  bind9:
    image: internetsystemsconsortium/bind9:9.20
    container_name: bind9
    restart: always
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./bind/config:/etc/bind                   # Configuración principal
      - ./bind/config/zones:/etc/bind/zones       # Archivos de zona      
      - ./bind/logs:/var/log/named                # Logs
    environment:
      - TZ=Europe/Madrid
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      services_net:
        ipv4_address: 172.20.0.6


#------------------------------------------------------------#

# SSH
  sshServices:     #Por par de claves
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: openssh-service
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=userserv
      - PUBLIC_KEY_FILE=/config/keys/id_rsa.pub 
      - PUBLIC_KEY_DIR=/config/keys
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false 
      - LOG_STDOUT=true
    volumes:
      - ./ssh/services/sshServ.config:/config/sshd_config
      - ./ssh/services/startServ.sh:/custom-cont-init.d/start.sh
      - ./ssh/services/keys:/config/keys
    networks:
      services_net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped
    # Cuando pida la passphrase en esa clave es Services

  sshDev:     #Por login
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: openssh-Dev
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=userdev
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=supersecreto
      - LOG_STDOUT=true
    volumes:
      - ./ssh/development/sshDev.config:/config/sshd_config
      - ./ssh/development/startDev.sh:/custom-cont-init.d/start.sh
    networks:
      development_net:
        ipv4_address: 172.40.0.10   # IP fija dentro de la red de servicios
    restart: unless-stopped   
  
# Firewall 
  firewall:
    image: alpine:latest
    container_name: firewall
    restart: always
    sysctls:
      net.ipv4.ip_forward: "1"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./firewall/startup.sh:/firewall.sh
    networks:
      development_net:
        ipv4_address: 172.40.0.15
      production_net:
        ipv4_address: 172.30.0.15
      services_net:
        ipv4_address: 172.20.0.15
      vpn_net:
        ipv4_address: 172.10.0.15
    command: sh -c "sh /firewall.sh"

#------------------------------------------------------------#
# VPN 
  openvpn:
    image: kylemanna/openvpn
    container_name: openvpn
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
    environment:
      - EASYRSA_BATCH=1
    volumes:
      - ovpndata:/etc/openvpn
      - ./vpn/start.sh:/start.sh
      - ./vpn/ovpn-data/clients:/etc/openvpn/clients
    entrypoint: ["/bin/sh", "/start.sh"]
    restart: always
    command: ovpn_run
    networks:
      vpn_net:
        ipv4_address: 172.10.0.100

  #Samba 
  samba:
    image: dperson/samba
    container_name: samba_server
    restart: always
    networks:
      development_net:
        ipv4_address: 172.40.0.20

    volumes:
      - ./samba/SambaInit.sh:/init.sh
      - samba_data:/mount

    command: ["/bin/sh", "/init.sh"]

  # FTP 
  ftp-server:
    image: debian:12
    container_name: ftp_server
    restart: always
    volumes:
      - samba_data:/ftp
      - ./ftp/startftp.sh:/start.sh
    command: bash /start.sh
    ports:
      - "21:21"
      - "30000:30000"
    networks:
      development_net:
        ipv4_address: 172.40.0.21

#------------------------------------------------------------#

networks:
  services_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  production_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  development_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
  vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.0.0/24

#------------------------------------------------------------#

volumes:
  devData:
  devdb:
  prodData:
  proddb:
  dnscache:
  dnslogs:
  ovpndata:
  samba_data:
