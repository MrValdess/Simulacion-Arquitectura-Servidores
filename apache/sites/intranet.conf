<VirtualHost *:80>

    ServerName intranet.empresa.local
    DocumentRoot /var/www/html/intranet

    ErrorDocument 403 /errors/403.html
    ErrorDocument 404 /errors/404.html

    Alias /errors /var/www/html/errors

    <Directory /var/www/html/intranet>
        <RequireAll>
            Require all denied
            Require ip 172.10.0.0/24
        </RequireAll>
        Options -Indexes
    </Directory>

    <Directory /var/www/html/errors>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule \.php$ /errors/php.html [L]

</VirtualHost>