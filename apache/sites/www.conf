<VirtualHost *:80>

    ServerName www.empresa.local

    DocumentRoot /var/www/html/public

    Alias /errors /var/www/html/errors

    ErrorDocument 403 /errors/403.html
    ErrorDocument 404 /errors/404.html

    Alias /documentacion /documentacion/publico

    Alias /documentacion /documentacion/publico

    <Directory "/documentacion/publico">

        Options Indexes

        AuthType Basic
        AuthName "Documentacion"

        AuthUserFile /etc/apache2/.htpasswd

        Require valid-user

    </Directory>

    RewriteEngine On
    RewriteRule \.php$ /errors/php.html [L]

</VirtualHost>