port 1194
proto udp
dev tun0

# Certificados y claves
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/issued/localhost.crt
key /etc/openvpn/pki/private/localhost.key
dh /etc/openvpn/pki/dh.pem

tls-auth /etc/openvpn/pki/ta.key
key-direction 0
server 172.10.0.0 255.255.255.0
topology subnet

# Rutas
push "route 172.40.0.0 255.255.255.0"   # DEV
push "route 172.30.0.0 255.255.255.0"   # PROD
push "route 172.20.0.0 255.255.255.0"   # SVC

# DNS
push "dhcp-option DNS 172.20.0.6"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"

# Seguridad
keepalive 10 60
persist-key
persist-tun
user nobody
group nogroup

verb 3
status /tmp/openvpn-status.log
comp-lzo no
push "comp-lzo no"
